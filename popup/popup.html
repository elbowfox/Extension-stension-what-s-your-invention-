<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabFlow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <img src="../icons/icon32.png" alt="TabFlow" width="24" height="24" />
        <span class="logo-text">TabFlow</span>
        <span id="pro-badge" class="pro-badge hidden">PRO</span>
      </div>
      <div class="header-actions">
        <button id="btn-search-toggle" class="icon-btn" title="Search tabs (Ctrl+F)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button id="btn-options" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/><circle cx="12" cy="12" r="10" stroke-dasharray="4 2"/></svg>
        </button>
      </div>
    </header>

    <!-- Search bar (hidden by default) -->
    <div id="search-bar" class="search-bar hidden">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="search-input" type="text" placeholder="Search open tabs..." autocomplete="off" />
      <button id="btn-search-close" class="icon-btn-sm">✕</button>
    </div>

    <!-- Tab Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <span id="open-tabs-count" class="stat-value">0</span>
        <span class="stat-label">open tabs</span>
      </div>
      <div class="stat">
        <span id="sessions-count" class="stat-value">0</span>
        <span class="stat-label">sessions saved</span>
      </div>
      <div class="stat">
        <span id="tabs-saved-count" class="stat-value">0</span>
        <span class="stat-label">tabs stored</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="btn-save-session" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Session
      </button>
      <button id="btn-close-all" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Close All
      </button>
    </div>

    <!-- Open Tabs List (search results) -->
    <div id="open-tabs-section" class="section hidden">
      <div class="section-header">
        <span>Open Tabs</span>
        <span id="search-results-count" class="count-badge">0</span>
      </div>
      <ul id="open-tabs-list" class="tab-list"></ul>
    </div>

    <!-- Saved Sessions List -->
    <div class="section">
      <div class="section-header">
        <span>Saved Sessions</span>
        <button id="btn-sort" class="icon-btn-sm" title="Sort by name">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
        </button>
      </div>
      <div id="sessions-list" class="sessions-list">
        <div class="empty-state">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/></svg>
          <p>No sessions saved yet</p>
          <small>Click "Save Session" to save your open tabs</small>
        </div>
      </div>
    </div>

    <!-- Upgrade Banner (shown for free users after limit) -->
    <div id="upgrade-banner" class="upgrade-banner hidden">
      <div class="upgrade-content">
        <strong>🚀 Upgrade to TabFlow Pro</strong>
        <p>Unlimited sessions + sync across devices</p>
      </div>
      <a id="btn-upgrade" href="#" class="btn-upgrade">Upgrade $2.99/mo</a>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>TabFlow v1.0</span>
      <a id="footer-upgrade" href="#" class="footer-link">Go Pro ✨</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
