# Extension Stension What S Your Invention  Workflow Feature Development Across Extension Files

## Action

Follow the feature-development-across-extension-files workflow:
1. Edit or add implementation files (background.js, content.js, popup/popup.js, options/options.js, etc.)
2. Update UI files as needed (popup/popup.html, options/options.html, corresponding .css)
3. Update manifest.json to reflect new permissions or features
4. Update documentation (README.md, store/listing.md, privacy-policy.html)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: background.js, content.js, popup/popup.js

